# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: urlo_test
          POSTGRES_PASSWORD: urlo_test
          POSTGRES_DB: urlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlo_test -d urlo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      URLO_TEST_POSTGRES_DSN: postgres://urlo_test:urlo_test@localhost:5432/urlo_test?sslmode=disable
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Verify generated Ent code
      run: |
        make ent
        git diff --exit-code -- internal/relations/ent
        test -z "$(git ls-files --others --exclude-standard -- internal/relations/ent)"

    - name: Validate and apply PostgreSQL migrations
      env:
        URLO_POSTGRES_DSN: ${{ env.URLO_TEST_POSTGRES_DSN }}
      run: |
        go install -tags='no_mysql no_sqlite3 no_ydb no_mssql no_libsql no_azuresql no_clickhouse no_vertica' github.com/pressly/goose/v3/cmd/goose@v3.29.0
        goose -dir migrations/postgres validate
        make postgres-migrate

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
